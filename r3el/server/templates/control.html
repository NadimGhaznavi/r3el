{% extends 'base.html' %}
{% block title %}Batch controls{% endblock %}
{% block content %}
<img class="control-logo" src="{{ settings.CONTROL_LOGO_URL }}" alt="R3el">
<h1>Batch controls</h1>
<div class="batch-controls">
  <form onsubmit="return false" aria-label="New batch">
    <label class="media-directory" for="media-directory">Media Directory
      <input id="media-directory" name="media_directory" type="text" value="{{ settings.FILM_DIR }}">
    </label>
    <label for="batch-size">Batch Size
      <select id="batch-size" name="batch_size">
        {% for size in settings.BATCH_SIZES %}<option value="{{ size }}" {% if size == settings.BATCH_SIZE %}selected{% endif %}>{{ size }}</option>{% endfor %}
      </select>
    </label>
    <button type="button" aria-describedby="batch-note">New Batch</button>
  </form>
  <p class="note" id="batch-note">New Batch is a placeholder. No processing will start.</p>
</div>
{% endblock %}
