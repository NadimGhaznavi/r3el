<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #111820; color: #e3eaf0; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  a { color: #8dd9cb; text-underline-offset: .2em; }
  .masthead { padding: 1.2rem 2rem; border-bottom: 1px solid #344351; display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .masthead > a { font-size: 1.3rem; font-weight: 700; text-decoration: none; }
  .masthead span, .note { color: #aabac8; }
  .masthead-details { margin-left: auto; text-align: right; }
  .last-updated { display: block; margin-top: .5rem; font-size: .85rem; }
  .workspace-files td:first-child { overflow-wrap: anywhere; }
  main { padding: 1rem 2rem 3rem; }
  h1 { font-size: 1.8rem; margin-bottom: .5rem; }
  form { display: flex; align-items: end; flex-wrap: wrap; gap: 1rem; margin: 1.5rem 0; }
  label { display: grid; gap: .4rem; }
  input, select, button { font: inherit; padding: .6rem; border-radius: .3rem; border: 1px solid #526474; background: #1b2935; color: inherit; }
  .control-logo { display: block; width: min(100%, 20rem); height: auto; margin: 1rem 0; }
  .media-directory { flex: 1 1 20rem; }
  .media-directory input { width: 100%; min-width: 0; }
  .batch-controls { max-width: 60rem; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid #8dd9cb; outline-offset: 3px; }
  .table-wrap { overflow-x: auto; border: 1px solid #344351; border-radius: .4rem; }
  table { border-collapse: collapse; width: 100%; text-align: left; font-size: .9rem; }
  th, td { padding: .8rem; border-bottom: 1px solid #344351; vertical-align: top; }
  th { background: #1b2935; }
  .filter-row { background: #1b2935; }
  .filter-row select { display: block; width: 100%; }
  .filter-row select + select { margin-top: .5rem; }
  tr:last-child td { border-bottom: 0; }
  time, .level, .event-source { white-space: nowrap; }
  .level-error, .level-critical { color: #ffaba4; }
  .level-warning { color: #f4d17b; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: .85rem; line-height: 1.5; margin: 0; }
  .preview { min-width: 18rem; max-width: 45rem; }
  .preview pre { max-height: 9rem; overflow: auto; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: .6rem 1.5rem; }
  dd { margin: 0; overflow-wrap: anywhere; }
  .message { padding: 1.2rem; background: #1b2935; border-radius: .4rem; }
  @media (max-width: 600px) { main, .masthead { padding: 1rem; } dl { grid-template-columns: 1fr; } }
</style>
